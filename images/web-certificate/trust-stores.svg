<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 548" width="720" height="548" role="img" aria-labelledby="t d">
<title id="t">不同 client 的 trust store 對照動畫</title>
<desc id="d">同一張由公司 root 簽發的 github.com 憑證，送到六種 client：Chrome 與 macOS 程式讀得到 MDM 裝進 OS 的公司 root，所以信任；macOS 內建 curl、Java cacerts、IntelliJ 自帶的 JBR、Docker container 各有自己的名單，不認得公司 root，所以報錯。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#1a202c;font-size:16px}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace}
.t{font-size:20px;font-weight:700}
.s{font-size:15px}
.b{font-weight:700}
.mu{fill:#4a5568}
.c{text-anchor:middle}
.an{animation-duration:12s;animation-timing-function:linear;animation-iteration-count:infinite}
.dt{opacity:0}
.r0{animation-name:r0}.r1{animation-name:r1}.r2{animation-name:r2}.r3{animation-name:r3}.r4{animation-name:r4}.r5{animation-name:r5}
.q0{animation-name:q0}.q1{animation-name:q1}.q2{animation-name:q2}.q3{animation-name:q3}.q4{animation-name:q4}.q5{animation-name:q5}
@keyframes r0{0%,8.3%{opacity:0}10.5%,93%{opacity:1}96.5%,100%{opacity:0}}
@keyframes r1{0%,15.8%{opacity:0}18%,93%{opacity:1}96.5%,100%{opacity:0}}
@keyframes r2{0%,23.3%{opacity:0}25.5%,93%{opacity:1}96.5%,100%{opacity:0}}
@keyframes r3{0%,30.8%{opacity:0}33%,93%{opacity:1}96.5%,100%{opacity:0}}
@keyframes r4{0%,38.3%{opacity:0}40.5%,93%{opacity:1}96.5%,100%{opacity:0}}
@keyframes r5{0%,45.8%{opacity:0}48%,93%{opacity:1}96.5%,100%{opacity:0}}
@keyframes q0{0%,3.3%{opacity:0;transform:translate(0,0)}3.8%{opacity:1;transform:translate(0,0)}8.3%{opacity:1;transform:translate(60px,-190px)}8.8%,100%{opacity:0;transform:translate(60px,-190px)}}
@keyframes q1{0%,10.8%{opacity:0;transform:translate(0,0)}11.3%{opacity:1;transform:translate(0,0)}15.8%{opacity:1;transform:translate(60px,-114px)}16.3%,100%{opacity:0;transform:translate(60px,-114px)}}
@keyframes q2{0%,18.3%{opacity:0;transform:translate(0,0)}18.8%{opacity:1;transform:translate(0,0)}23.3%{opacity:1;transform:translate(60px,-38px)}23.8%,100%{opacity:0;transform:translate(60px,-38px)}}
@keyframes q3{0%,25.8%{opacity:0;transform:translate(0,0)}26.3%{opacity:1;transform:translate(0,0)}30.8%{opacity:1;transform:translate(60px,38px)}31.3%,100%{opacity:0;transform:translate(60px,38px)}}
@keyframes q4{0%,33.3%{opacity:0;transform:translate(0,0)}33.8%{opacity:1;transform:translate(0,0)}38.3%{opacity:1;transform:translate(60px,114px)}38.8%,100%{opacity:0;transform:translate(60px,114px)}}
@keyframes q5{0%,40.8%{opacity:0;transform:translate(0,0)}41.3%{opacity:1;transform:translate(0,0)}45.8%{opacity:1;transform:translate(60px,190px)}46.3%,100%{opacity:0;transform:translate(60px,190px)}}
@media (prefers-reduced-motion:reduce){.an{animation:none!important}.dt{opacity:0!important}}
</style>
<rect width="720" height="548" fill="#ffffff"/>
<text x="360" y="34" class="t c">同一張憑證，每個 client 拿自己的名單判斷</text>
<text x="360" y="60" class="s mu c">情境：公司防火牆用「公司 root」重簽憑證，這張 root 只被 MDM 裝進了 OS</text>
<g fill="none" stroke="#cbd5e0" stroke-width="2">
<path d="M210 306L270 116"/><path d="M210 306L270 192"/><path d="M210 306L270 268"/>
<path d="M210 306L270 344"/><path d="M210 306L270 420"/><path d="M210 306L270 496"/>
</g>
<rect x="20" y="246" width="190" height="120" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
<text x="115" y="276" class="c b">伺服器送來的</text>
<text x="115" y="302" class="c s mono">github.com</text>
<text x="115" y="326" class="c s mu">簽發者 Issuer</text>
<text x="115" y="350" class="c s b" style="fill:#b45309">公司 root</text>
<g>
<rect x="270" y="84" width="430" height="64" rx="10" fill="#f7fafc" stroke="#cbd5e0"/>
<text x="288" y="110" class="b">Chrome / Edge</text>
<text x="288" y="134" class="s mu">Chrome Root Store ＋ OS 裡的企業 root</text>
</g>
<g>
<rect x="270" y="160" width="430" height="64" rx="10" fill="#f7fafc" stroke="#cbd5e0"/>
<text x="288" y="186" class="b">Safari、macOS App</text>
<text x="288" y="210" class="s mu">macOS 鑰匙圈（Keychain）</text>
</g>
<g>
<rect x="270" y="236" width="430" height="64" rx="10" fill="#f7fafc" stroke="#cbd5e0"/>
<text x="288" y="262" class="b">curl（macOS 內建）</text>
<text x="288" y="286" class="s mu">/etc/ssl/cert.pem</text>
</g>
<g>
<rect x="270" y="312" width="430" height="64" rx="10" fill="#f7fafc" stroke="#cbd5e0"/>
<text x="288" y="338" class="b">Java（Maven・Spring Boot）</text>
<text x="288" y="362" class="s mu">$JAVA_HOME/lib/security/cacerts</text>
</g>
<g>
<rect x="270" y="388" width="430" height="64" rx="10" fill="#f7fafc" stroke="#cbd5e0"/>
<text x="288" y="414" class="b">IntelliJ 裡跑的 Gradle</text>
<text x="288" y="438" class="s mu">IDE 自帶 JBR 的另一份 cacerts</text>
</g>
<g>
<rect x="270" y="464" width="430" height="64" rx="10" fill="#f7fafc" stroke="#cbd5e0"/>
<text x="288" y="490" class="b">Docker container</text>
<text x="288" y="514" class="s mu">image 裡的 /etc/ssl/certs</text>
</g>
<g class="an r0"><rect x="576" y="100" width="112" height="32" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/><text x="632" y="121" class="c s b" style="fill:#15803d">✓ 認得</text></g>
<g class="an r1"><rect x="576" y="176" width="112" height="32" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/><text x="632" y="197" class="c s b" style="fill:#15803d">✓ 認得</text></g>
<g class="an r2"><rect x="576" y="252" width="112" height="32" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="632" y="273" class="c s b" style="fill:#b91c1c">✗ 不認得</text></g>
<g class="an r3"><rect x="576" y="328" width="112" height="32" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="632" y="349" class="c s b" style="fill:#b91c1c">✗ 不認得</text></g>
<g class="an r4"><rect x="576" y="404" width="112" height="32" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="632" y="425" class="c s b" style="fill:#b91c1c">✗ 不認得</text></g>
<g class="an r5"><rect x="576" y="480" width="112" height="32" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="632" y="501" class="c s b" style="fill:#b91c1c">✗ 不認得</text></g>
<circle class="an dt q0" cx="210" cy="306" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
<circle class="an dt q1" cx="210" cy="306" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
<circle class="an dt q2" cx="210" cy="306" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
<circle class="an dt q3" cx="210" cy="306" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
<circle class="an dt q4" cx="210" cy="306" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
<circle class="an dt q5" cx="210" cy="306" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
</svg>
