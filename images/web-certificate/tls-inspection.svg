<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" width="720" height="530" role="img" aria-labelledby="t d">
<title id="t">防火牆 SSL inspection 動畫</title>
<desc id="d">公司防火牆把一條 HTTPS 連線拆成兩段：防火牆與 github.com 之間是真正的 Sectigo 憑證；防火牆與你的電腦之間，是防火牆用公司 root 即時簽發的假憑證。瀏覽器因為 OS 裡裝了公司 root 而信任，Java、curl、git、Docker container 不認得而報錯。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#1a202c;font-size:16px}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace}
.t{font-size:20px;font-weight:700}
.s{font-size:15px}
.b{font-weight:700}
.mu{fill:#4a5568}
.c{text-anchor:middle}
.e{text-anchor:end}
.gr{fill:#15803d}
.rd{fill:#b91c1c}
.am{fill:#b45309}
.an{animation-duration:12s;animation-timing-function:linear;animation-iteration-count:infinite}
.dt{opacity:0}
.pb{animation-name:pb}.pa{animation-name:pa}.cb{animation-name:cb}.fw{animation-name:cb}.ca{animation-name:ca}
.r0{animation-name:r0}.r1{animation-name:r1}.r2{animation-name:r2}.r3{animation-name:r3}
@keyframes pb{0%,4.2%{opacity:0;transform:translateX(0)}4.7%{opacity:1;transform:translateX(0)}12.5%{opacity:1;transform:translateX(-110px)}13%,100%{opacity:0;transform:translateX(-110px)}}
@keyframes pa{0%,21.7%{opacity:0;transform:translateX(0)}22.2%{opacity:1;transform:translateX(0)}30%{opacity:1;transform:translateX(-110px)}30.5%,100%{opacity:0;transform:translateX(-110px)}}
@keyframes cb{0%,12.5%{opacity:0}15%,93%{opacity:1}96.5%,100%{opacity:0}}
@keyframes ca{0%,30%{opacity:0}32.5%,93%{opacity:1}96.5%,100%{opacity:0}}
@keyframes r0{0%,37%{opacity:0}39.5%,93%{opacity:1}96.5%,100%{opacity:0}}
@keyframes r1{0%,43%{opacity:0}45.5%,93%{opacity:1}96.5%,100%{opacity:0}}
@keyframes r2{0%,49%{opacity:0}51.5%,93%{opacity:1}96.5%,100%{opacity:0}}
@keyframes r3{0%,55%{opacity:0}57.5%,93%{opacity:1}96.5%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.an{animation:none!important}.dt{opacity:0!important}}
</style>
<rect width="720" height="530" fill="#ffffff"/>
<text x="360" y="34" class="t c">公司防火牆 SSL inspection：一條連線拆成兩段</text>
<text x="360" y="60" class="s mu c">防火牆即時用「公司 root」簽一張假的 github.com 憑證給你</text>
<rect x="170" y="108" width="115" height="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="227" y="100" class="c s b am">TLS 連線 A</text>
<rect x="435" y="108" width="115" height="30" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="492" y="100" class="c s b gr">TLS 連線 B</text>
<rect x="20" y="86" width="150" height="74" rx="12" fill="#e6f7fb" stroke="#61c8e0" stroke-width="2"/>
<text x="95" y="116" class="c b">你的電腦</text>
<text x="95" y="140" class="c s mu">Chrome / Java</text>
<rect x="285" y="86" width="150" height="74" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
<text x="360" y="116" class="c b">公司防火牆</text>
<text x="360" y="140" class="c s mu">解密・檢查・重簽</text>
<rect class="an fw" x="280" y="81" width="160" height="84" rx="15" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 4"/>
<rect x="550" y="86" width="150" height="74" rx="12" fill="#e6f7fb" stroke="#61c8e0" stroke-width="2"/>
<text x="625" y="116" class="c b mono">github.com</text>
<text x="625" y="140" class="c s mu">真正的伺服器</text>
<g class="an ca">
<rect x="20" y="186" width="330" height="94" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
<text x="36" y="212" class="b">連線 A 拿到的憑證（假的）</text>
<text x="36" y="238" class="s mono">Subject: github.com</text>
<text x="36" y="262" class="s mono">Issuer:  <tspan class="b am">Corp Firewall Root</tspan></text>
</g>
<g class="an cb">
<rect x="370" y="186" width="330" height="94" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="386" y="212" class="b">連線 B 拿到的憑證（真的）</text>
<text x="386" y="238" class="s mono">Subject: github.com</text>
<text x="386" y="262" class="s mono">Issuer:  <tspan class="b gr">Sectigo CA DV E36</tspan></text>
</g>
<text x="36" y="316" class="b">同一台電腦上，誰會報錯？</text>
<g class="an r0">
<rect x="20" y="330" width="680" height="40" rx="8" fill="#f7fafc"/>
<text x="36" y="356" class="b">Chrome / Edge / Safari</text>
<text x="684" y="356" class="e s b gr">✓ 公司 root 已由 MDM 裝進 OS</text>
</g>
<g class="an r1">
<rect x="20" y="378" width="680" height="40" rx="8" fill="#f7fafc"/>
<text x="36" y="404" class="b">Java（Maven・Gradle・Spring Boot）</text>
<text x="684" y="404" class="e s b rd">✗ PKIX path building failed</text>
</g>
<g class="an r2">
<rect x="20" y="426" width="680" height="40" rx="8" fill="#f7fafc"/>
<text x="36" y="452" class="b">curl / git</text>
<text x="684" y="452" class="e s b rd">✗ self signed certificate in certificate chain</text>
</g>
<g class="an r3">
<rect x="20" y="474" width="680" height="40" rx="8" fill="#f7fafc"/>
<text x="36" y="500" class="b">docker build（容器裡）</text>
<text x="684" y="500" class="e s b rd">✗ 容器有自己的 trust store</text>
</g>
<g class="an dt pb">
<rect x="525" y="113" width="30" height="20" rx="3" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
<path d="M525 113L540 125L555 113" fill="none" stroke="#15803d" stroke-width="2"/>
</g>
<g class="an dt pa">
<rect x="260" y="113" width="30" height="20" rx="3" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<path d="M260 113L275 125L290 113" fill="none" stroke="#b45309" stroke-width="2"/>
</g>
</svg>
