<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" width="720" height="590" role="img" aria-labelledby="t d">
<title id="t">Chain of Trust 驗證動畫</title>
<desc id="d">github.com 的憑證鏈：網站憑證由中繼憑證簽發，中繼憑證由根憑證簽發。瀏覽器由下往上，用上一層的公鑰驗證每一層的簽章，最後確認根憑證在本機的 trust store 名單裡，整條鏈才被信任。</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2d3748"/></marker>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#1a202c;font-size:16px}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace}
.t{font-size:20px;font-weight:700}
.s{font-size:15px}
.b{font-weight:700}
.mu{fill:#4a5568}
.c{text-anchor:middle}
.gr{fill:#15803d}
.am{fill:#b45309}
.tl{fill:#0e7490}
.an{animation-duration:12s;animation-timing-function:linear;animation-iteration-count:infinite}
.dt{opacity:0}
.g0{animation-name:g0}.c1{animation-name:c1}.g1{animation-name:c1}.c2{animation-name:c2}.g2{animation-name:c2}
.m3{animation-name:m3}.fin{animation-name:fin}
.p1{animation-name:p1}.p2{animation-name:p2}.p3{animation-name:p3}
@keyframes g0{0%,2.5%{opacity:0}6%,93%{opacity:1}96.5%,100%{opacity:0}}
@keyframes c1{0%,15%{opacity:0}17.5%,93%{opacity:1}96.5%,100%{opacity:0}}
@keyframes c2{0%,26.7%{opacity:0}29%,93%{opacity:1}96.5%,100%{opacity:0}}
@keyframes m3{0%,36.7%{opacity:0}39%,93%{opacity:1}96.5%,100%{opacity:0}}
@keyframes fin{0%,45%{opacity:0}48%,93%{opacity:1}96.5%,100%{opacity:0}}
@keyframes p1{0%,8.3%{opacity:0;transform:translateY(0)}8.8%{opacity:1;transform:translateY(0)}15%{opacity:1;transform:translateY(-72px)}15.5%,100%{opacity:0;transform:translateY(-72px)}}
@keyframes p2{0%,20%{opacity:0;transform:translateY(0)}20.5%{opacity:1;transform:translateY(0)}26.7%{opacity:1;transform:translateY(-72px)}27.2%,100%{opacity:0;transform:translateY(-72px)}}
@keyframes p3{0%,31.7%{opacity:0;transform:translate(0,0)}32.2%{opacity:1;transform:translate(0,0)}36.7%{opacity:1;transform:translate(38px,6px)}37.2%,100%{opacity:0;transform:translate(38px,6px)}}
@media (prefers-reduced-motion:reduce){.an{animation:none!important}.dt{opacity:0!important}}
</style>
<rect width="720" height="590" fill="#ffffff"/>
<text x="360" y="36" class="t c">Chain of Trust：信任一層一層往下傳</text>
<text x="360" y="60" class="s mu c">以 github.com 實際的憑證鏈為例</text>
<path d="M140 86H128V174H140" fill="none" stroke="#a0aec0" stroke-width="2"/>
<text x="68" y="124" class="s c b">本機內建</text>
<text x="68" y="146" class="s c mu">不靠伺服器送</text>
<path d="M140 252H128V506H140" fill="none" stroke="#a0aec0" stroke-width="2"/>
<text x="68" y="372" class="s c b">伺服器</text>
<text x="68" y="394" class="s c b">送來的</text>
<rect x="150" y="84" width="320" height="92" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="166" y="110" class="b">根憑證 Root CA</text>
<text x="166" y="136" class="s mono">Subject: <tspan class="am b">Sectigo Root E46</tspan></text>
<text x="166" y="160" class="s mono">Issuer:  <tspan class="am">Sectigo Root E46</tspan>（自簽）</text>
<rect x="150" y="250" width="320" height="92" rx="12" fill="#e6f7fb" stroke="#61c8e0" stroke-width="2"/>
<text x="166" y="276" class="b">中繼憑證 Intermediate CA</text>
<text x="166" y="302" class="s mono">Subject: <tspan class="tl b">Sectigo CA DV E36</tspan></text>
<text x="166" y="326" class="s mono">Issuer:  <tspan class="am b">Sectigo Root E46</tspan></text>
<rect x="150" y="416" width="320" height="92" rx="12" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
<text x="166" y="442" class="b">網站憑證 Leaf</text>
<text x="166" y="468" class="s mono">Subject: github.com</text>
<text x="166" y="492" class="s mono">Issuer:  <tspan class="tl b">Sectigo CA DV E36</tspan></text>
<line x1="310" y1="250" x2="310" y2="180" stroke="#2d3748" stroke-width="2" marker-end="url(#a)"/>
<line x1="310" y1="416" x2="310" y2="346" stroke="#2d3748" stroke-width="2" marker-end="url(#a)"/>
<g class="an c2">
<text x="326" y="206" class="s">Issuer 對上 Subject</text>
<text x="326" y="228" class="s b gr">用 Root 公鑰驗簽章 ✓</text>
</g>
<g class="an c1">
<text x="326" y="372" class="s">Issuer 對上 Subject</text>
<text x="326" y="394" class="s b gr">用中繼公鑰驗簽章 ✓</text>
</g>
<rect class="an g0" x="145" y="411" width="330" height="102" rx="15" fill="none" stroke="#22c55e" stroke-width="3"/>
<rect class="an g1" x="145" y="245" width="330" height="102" rx="15" fill="none" stroke="#22c55e" stroke-width="3"/>
<rect class="an g2" x="145" y="79" width="330" height="102" rx="15" fill="none" stroke="#22c55e" stroke-width="3"/>
<rect x="500" y="84" width="204" height="172" rx="12" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/>
<text x="602" y="110" class="c b">你的 trust store</text>
<rect class="an m3" x="508" y="124" width="188" height="24" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="516" y="141" class="s">Sectigo Root E46</text>
<text x="516" y="167" class="s">ISRG Root X1</text>
<text x="516" y="193" class="s">DigiCert Global G2</text>
<text x="516" y="219" class="s">USERTrust ECC</text>
<text x="516" y="244" class="s mu">…共一百多張</text>
<line x1="470" y1="130" x2="506" y2="136" stroke="#a0aec0" stroke-width="2" stroke-dasharray="4 3"/>
<text x="602" y="284" class="s c mu">Root 沒有上一層可以驗，</text>
<text x="602" y="306" class="s c mu">它的信任來自「在名單裡」</text>
<g class="an fin">
<rect x="150" y="530" width="320" height="38" rx="19" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="310" y="555" class="c b gr">整條鏈驗過 → 信任 github.com ✓</text>
</g>
<circle class="an dt p1" cx="310" cy="416" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
<circle class="an dt p2" cx="310" cy="250" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
<circle class="an dt p3" cx="470" cy="130" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
</svg>
