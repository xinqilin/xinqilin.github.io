<footer class="footer">
    <div class="footer-content">
        <p>&copy; {{ now.Year }} {{ .Site.Params.author | default .Site.Title }}. All rights reserved.</p>
        {{ if .Site.Params.socialIcons }}
        <div class="social-links">
            {{ range .Site.Params.socialIcons }}
            <a href="{{ .url }}" class="social-link" target="_blank" rel="noopener">{{ .name }}</a>
            {{ end }}
        </div>
        {{ end }}
    </div>
</footer>
