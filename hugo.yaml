baseURL: https://xinqilin.github.io/
languageCode: zh-tw
defaultContentLanguage: zh-tw
timeZone: Asia/Taipei
theme: minimal-clean

outputs:
  home:
    - HTML
    - RSS
    - JSON

author: Bill Lin
title: Bill.Lin's Notes

enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableRobotsTXT: true
pagination:
  pagerSize: 10
  path: "page"

minify:
  disableXML: true
  minifyOutput: true


params:
  author: Bill Lin
  description: "技術筆記與開發心得分享"
  
  # home-info mode
  homeInfoParams:
    Title: "歡迎來到 Bill.Lin's Notes"
    Content: "分享程式開發、演算法、設計模式等技術筆記"
  
  # SEO 優化
  keywords: ["程式設計", "演算法", "Java", "Spring", "Docker", "設計模式", "技術筆記", "Bill.Lin"]
  
  # 網站設定
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  
  # 圖片優化
  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  # Giscus 留言系統配置
  giscus:
    enable: true
    repo: "xinqilin/xinqilin.github.io"  # 您的 GitHub Pages 儲存庫
    repoId: "MDEwOlJlcG9zaXRvcnkzODA3NTYzNzk="  # 請從 https://giscus.app 獲取
    category: "Announcements"  # GitHub Discussions 分類
    categoryId: "DIC_kwDOFrHhm84CtLOY"  # 請從 https://giscus.app 獲取
    mapping: "pathname"  # 頁面和討論的對應關係
    reactionsEnabled: "1"  # 啟用表情反應
    emitMetadata: "0"
    theme: "light"  # 主題：light, dark, dark_dimmed, transparent_dark
    lang: "zh-TW"  # 語言
    inputPosition: "bottom"  # 留言框位置：top 或 bottom
    loading: "lazy"  # 延遲加載

  socialIcons:
    - name: github
      url: "https://github.com/xinqilin"
    - name: linkedin
      url: "https://www.linkedin.com/in/bill-lin-47348017a/"
    - name: email
      url: "mailto:zzx123bill@gmail.com"
menu:
  main:
    - identifier: categories
      name: 分類
      url: /categories/
      weight: 10
    - identifier: tags
      name: 標籤
      url: /tags/
      weight: 20
    - identifier: about
      name: 關於
      url: /about/
      weight: 30
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: true
    lineNumbersInTable: true
    style: github
    guessSyntax: true

ignoreLogs: ['warning-goldmark-raw-html']

