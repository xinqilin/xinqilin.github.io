baseURL: https://xinqilin.github.io/
languageCode: zh-tw
defaultContentLanguage: zh-tw
theme: minimal-clean

author: Bill Lin
title: Bill.Lin's Notes

enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableRobotsTXT: true
pagination:
  pagerSize: 10
  path: "page"

minify:
  disableXML: true
  minifyOutput: true


params:
  author: Bill Lin
  description: "技術筆記與開發心得分享"
  
  # home-info mode
  homeInfoParams:
    Title: "歡迎來到 Bill.Lin's Notes"
    Content: "分享程式開發、演算法、設計模式等技術筆記"

  socialIcons:
    - name: github
      url: "https://github.com/xinqilin"
menu:
  main:
    - identifier: categories
      name: categories
      url: /categories/
      weight: 10
    - identifier: tags
      name: tags
      url: /tags/
      weight: 20
    - identifier: example
      name: example.org
      url: https://example.org
      weight: 30
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: true
    lineNumbersInTable: true
    style: github

ignoreLogs: ['warning-goldmark-raw-html']

